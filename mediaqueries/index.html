<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.container {
    display: flex;
    flex-wrap: wrap;
}

/* Default: Desktop (4 columns) */
.container img {
    flex: 0 0 25%;
    width: 100%;
    display: block;
    height: auto;
}

/* Tablet: 2 columns */
@media screen and (max-width: 820px) {
    .container img {
        flex: 0 0 50%;
    }
}

/* Mobile: 1 column */
@media screen and (max-width: 600px) {
    .container img {
        flex: 0 0 100%;
    }
}
</style>
</head>

<body>

<div class="container">
    <img src="1.png" alt="">
    <img src="2.png" alt="">
    <img src="3.jpg" alt="">
    <img src="4.png" alt="">
    <img src="5.png" alt="">
    <img src="6.png" alt="">
    <img src="7.jpg" alt="">
    <img src="8.jpg" alt="">
</div>

</body>
</html>
