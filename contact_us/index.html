<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff; /* pure white background */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 16px;
      background: #f9fafc;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid #eef0f5;
      position: relative;
    }

    /* top accent bar */
    .container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, #6c63ff, #00c6ff);
      border-radius: 16px 16px 0 0;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #222;
      font-size: 24px;
    }

    input, textarea {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #d9dbe3;
      background: #fff;
      font-size: 14px;
      transition: 0.25s;
    }

    input:focus, textarea:focus {
      border-color: #6c63ff;
      outline: none;
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.15);
    }

    textarea {
      height: 110px;
      resize: none;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: rgb(20, 102, 150);
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s ease;
      font-weight: bold;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(108, 99, 255, 0.25);
    }

    #status {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      color: green;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Contact Us</h2>

    <form id="contactForm">
      <input type="text" id="fullName" placeholder="Full Name" required>
      <input type="text" id="mobile" placeholder="Mobile Number" required>
      <input type="email" id="gmail" placeholder="Email Address" required>
      <textarea id="message" placeholder="How can we help?" required></textarea>
      <button type="submit">Send Message</button>
    </form>

    <p id="status"></p>
  </div>
<script type="module" src="scripts.js"></script>
</body>
</html>
